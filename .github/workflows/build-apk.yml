name: Build & Sign APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # 2. Java & Android SDK
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------------
      # 3. Gradle Wrapper
      #    Nếu repo chưa có gradle-wrapper.jar (file binary, thường không
      #    commit vào git), sinh nó bằng Gradle tạm thời rồi dùng wrapper.
      # ---------------------------------------------------------------
      - name: Bootstrap Gradle wrapper jar if missing
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar không có, bootstrap bằng Gradle tạm..."
            # Dùng gradle từ PATH (setup bởi actions/setup-java hoặc cài thêm)
            if ! command -v gradle &>/dev/null; then
              # Cài gradle 8.6 nhanh qua sdk manager alternative
              wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /opt/gradle
              export PATH="/opt/gradle/gradle-8.6/bin:$PATH"
              echo "/opt/gradle/gradle-8.6/bin" >> "$GITHUB_PATH"
            fi
            gradle wrapper --gradle-version 8.6 --no-daemon
          fi
          chmod +x gradlew
          echo "Gradle wrapper sẵn sàng: $(./gradlew --version | head -3)"

      # ---------------------------------------------------------------
      # 4. Gradle cache
      # ---------------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ---------------------------------------------------------------
      # 5. Chuẩn bị keystore / chữ ký
      #
      #   Ưu tiên 1 (khuyến nghị, an toàn): Secrets đã cấu hình trong repo
      #     KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      #     → Xem README để biết cách tạo và upload Secrets.
      #
      #   Ưu tiên 2 (tự động, repo public OK cho dùng cá nhân):
      #     Lần đầu: sinh keystore mới, commit vào app/keystore/ trong repo.
      #     Lần sau: dùng lại keystore đã commit → APK có cùng chữ ký
      #              → cài đè / update app bình thường.
      # ---------------------------------------------------------------
      - name: Prepare signing keystore
        id: signing
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_DIR="$GITHUB_WORKSPACE/app/keystore"
          KS_PATH="$KS_DIR/release.keystore"
          mkdir -p "$KS_DIR"

          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "✅ Dùng keystore từ GitHub Secrets."
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            KS_PASS="${SECRET_KEYSTORE_PASSWORD}"
            KS_ALIAS="${SECRET_KEY_ALIAS}"
            KS_KEY_PASS="${SECRET_KEY_PASSWORD}"

          elif [ -f "$KS_PATH" ]; then
            echo "✅ Dùng lại keystore đã có trong repo (chữ ký nhất quán giữa các build)."
            KS_PASS="changeit123"
            KS_ALIAS="datamonitor"
            KS_KEY_PASS="changeit123"

          else
            echo "⚙️  Sinh keystore mới (lần đầu)..."
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias datamonitor \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass changeit123 -keypass changeit123 \
              -dname "CN=DataMonitor,OU=Personal,O=DataMonitor,L=Hanoi,S=Hanoi,C=VN"
            KS_PASS="changeit123"
            KS_ALIAS="datamonitor"
            KS_KEY_PASS="changeit123"
            echo "NEW_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

          # Ghi env cho bước build
          echo "KEYSTORE_PATH=$KS_PATH"       >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS"    >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KS_ALIAS"           >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KS_KEY_PASS"     >> "$GITHUB_ENV"

          # Kiểm tra keystore hợp lệ
          keytool -list -keystore "$KS_PATH" -storepass "$KS_PASS" -alias "$KS_ALIAS" \
            && echo "✅ Keystore xác thực OK" \
            || { echo "❌ Keystore không hợp lệ!"; exit 1; }

      # ---------------------------------------------------------------
      # 6. Commit keystore lần đầu (chỉ khi vừa sinh mới)
      # ---------------------------------------------------------------
      - name: Commit new keystore to repo
        if: env.NEW_KEYSTORE == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f bắt buộc vì global gitignore của máy chủ CI block *.keystore
          git add -f app/keystore/release.keystore
          git commit -m "ci: lưu keystore ký APK [skip ci]"
          git push
          echo "✅ Keystore đã được commit vào repo — các lần build sau sẽ dùng lại."

      # ---------------------------------------------------------------
      # 7. Build APK release (có chữ ký, dùng ./gradlew)
      # ---------------------------------------------------------------
      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ---------------------------------------------------------------
      # 8. Xác định đường dẫn APK — chỉ lấy file đã ký, bỏ qua *unsigned*
      # ---------------------------------------------------------------
      - name: Locate signed APK
        id: apk
        run: |
          # Tìm APK đã ký (exclude *unsigned*)
          APK_PATH=$(find app/build/outputs/apk/release \
            -name "*.apk" \
            ! -name "*unsigned*" \
            | sort | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ Không tìm thấy APK đã ký!"
            find app/build/outputs/ -name "*.apk" | head -10
            exit 1
          fi

          # Kiểm tra file có chữ ký hợp lệ bằng apksigner
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_PATH" \
            && echo "✅ APK signature verified OK" \
            || { echo "❌ APK verify thất bại — APK có thể không cài được!"; exit 1; }

          FILE_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "📦 APK: $APK_PATH ($FILE_SIZE)"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename $APK_PATH)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # 9. Upload artifact
      # ---------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.filename }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ---------------------------------------------------------------
      # 10. Tạo GitHub Release kèm APK (tải thẳng về máy, cài được ngay)
      # ---------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: "Giám Sát Data v1.0 — Build #${{ github.run_number }}"
          body: |
            ## 📲 Cài đặt
            1. Tải file `.apk` bên dưới về điện thoại
            2. Mở file → bật "Cài từ nguồn không xác định" nếu được hỏi
            3. Cài đặt → mở app → cấp 2 quyền theo hướng dẫn trong app

            ## ℹ️ Thông tin build
            - Commit: `${{ github.sha }}`
            - Build: #${{ github.run_number }}
            - Yêu cầu: Android 9+ (API 28)
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false

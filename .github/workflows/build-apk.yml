name: Build & Sign APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      # ------------------------------------------------------------------
      # CHỮ KÝ (SIGNING)
      # Ưu tiên 1: nếu repo đã cấu hình Secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      #            KEY_ALIAS, KEY_PASSWORD) -> dùng keystore đó (an toàn hơn, khuyến nghị).
      # Ưu tiên 2: nếu chưa có Secrets -> tự động sinh 1 keystore mới trong lần chạy đầu
      #            tiên, dùng để build, rồi commit ngược lại vào repo (app/keystore/release.keystore)
      #            để các lần build sau dùng LẠI đúng key đó (giữ được khả năng cập nhật app).
      #            LƯU Ý BẢO MẬT: nếu repo là public, file keystore này ai cũng xem được.
      #            Điều đó chỉ chấp nhận được cho mục đích cá nhân/tự cài, KHÔNG dùng để
      #            phát hành app thật. Muốn an toàn hơn, hãy tạo Secrets ở bước dưới đây.
      # ------------------------------------------------------------------
      - name: Prepare keystore
        id: keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          KS_PATH="$GITHUB_WORKSPACE/app/keystore/release.keystore"

          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "Dùng keystore từ GitHub Secrets."
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            echo "KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          elif [ -f "$KS_PATH" ]; then
            echo "Đã tìm thấy keystore có sẵn trong repo, dùng lại để giữ nguyên chữ ký."
            echo "KEYSTORE_PASSWORD=changeit123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=datamonitor" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=changeit123" >> "$GITHUB_ENV"
          else
            echo "Chưa có keystore -> tự động sinh mới (chỉ nên dùng cho mục đích cá nhân)."
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias datamonitor \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass changeit123 -keypass changeit123 \
              -dname "CN=DataMonitor, OU=Personal, O=DataMonitor, L=Hanoi, S=Hanoi, C=VN"
            echo "KEYSTORE_PASSWORD=changeit123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=datamonitor" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=changeit123" >> "$GITHUB_ENV"
            echo "NEW_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

          echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Commit newly generated keystore back to repo
        if: env.NEW_KEYSTORE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/keystore/release.keystore
          git commit -m "ci: auto-generate release signing keystore [skip ci]"
          git push

      - name: Grant execute permission (if gradlew exists)
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK built at: $APK_PATH"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Bản build tự động #${{ github.run_number }}"
          body: |
            APK được build và ký tự động bởi GitHub Actions.
            Tải file .apk bên dưới về điện thoại và cài đặt trực tiếp
            (nhớ bật "Cài đặt từ nguồn không xác định" cho trình duyệt/File Manager).
          files: ${{ steps.apk.outputs.path }}
